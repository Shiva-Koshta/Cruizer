name: Release

# Manual release: bump versionCode/versionName in app/build.gradle.kts, commit,
# then run this workflow from the Actions tab. It tests, builds, signs with the
# same debug key as local installs (secret DEBUG_KEYSTORE = base64 debug.keystore),
# tags v<versionName> and publishes a GitHub Release with auto-generated notes.
# Re-running for the same version fails on release-create by design: bump first.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need full history since the last tag

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner ships the SDK; the old "tools" package that
      # android-actions/setup-android@v3 still installs no longer exists.
      # Accept licenses so AGP can auto-download platform/build-tools.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Same keystore as local builds, so Actions releases update over
      # locally installed apps (and vice versa) without uninstalling.
      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          printf '%s' "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        run: ./gradlew app:testDebugUnitTest app:assembleRelease --no-daemon

      - name: Read version
        id: ver
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing Cruizer v$name (code $code)"

      - name: Tag the dispatched commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.ver.outputs.name }}" "${{ github.sha }}"
          git push origin "v${{ steps.ver.outputs.name }}" --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "cruizer-${{ steps.ver.outputs.name }}.apk"
          gh release create "v${{ steps.ver.outputs.name }}" \
            "cruizer-${{ steps.ver.outputs.name }}.apk" \
            --target "${{ github.sha }}" \
            --title "Cruizer v${{ steps.ver.outputs.name }}" \
            --generate-notes
