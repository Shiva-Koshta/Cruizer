name: Release

# Manual release: bump versionCode/versionName in app/build.gradle.kts, commit,
# then run this workflow from the Actions tab. It tests, builds and signs with
# the dedicated release key (secret RELEASE_KEYSTORE), tags v<versionName> and
# publishes a GitHub Release with auto-generated notes.
# Re-running for the same version fails on release-create by design: bump first.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need full history since the last tag

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner ships the SDK; the old "tools" package that
      # android-actions/setup-android@v3 still installs no longer exists.
      # Accept licenses so AGP can auto-download platform/build-tools.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Restore the dedicated release keystore from secrets and expose it to Gradle.
      # F-Droid builds without these (unsigned) for reproducibility verification.
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "RELEASE_KEYSTORE secret missing; building unsigned" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.config/cruizer
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > ~/.config/cruizer/release.keystore
          echo "RELEASE_KEYSTORE_PATH=$HOME/.config/cruizer/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=cruizer" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew app:testDebugUnitTest app:assembleRelease --no-daemon

      - name: Read version
        id: ver
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing Cruizer v$name (code $code)"

      - name: Tag the dispatched commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.ver.outputs.name }}" "${{ github.sha }}"
          git push origin "v${{ steps.ver.outputs.name }}" --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "cruizer-${{ steps.ver.outputs.name }}.apk"
          gh release create "v${{ steps.ver.outputs.name }}" \
            "cruizer-${{ steps.ver.outputs.name }}.apk" \
            --target "${{ github.sha }}" \
            --title "Cruizer v${{ steps.ver.outputs.name }}" \
            --generate-notes
