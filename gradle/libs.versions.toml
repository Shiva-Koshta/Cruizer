[versions]
agp = "9.5.0"
kotlin = "2.3.20"
composeBom = "2026.09.00"
material3 = "1.5.0-rc01"
activityCompose = "1.10.1"
androidxCore = "1.17.0"
datastore = "1.1.7"
coroutines = "1.10.2"
junit = "4.13.2"
# Build-tooling CVE pins: AGP 9.5.x ships vulnerable transitive libs (see docs/AUDIT.md).
bouncycastle = "1.85"
guava = "33.7.2-jre"
jose4j = "0.9.6"
jdom2 = "2.0.6.1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-datastore-prefs = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
pin-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
pin-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
pin-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
pin-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
pin-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
pin-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }

[bundles]
build-tool-pins = ["pin-bcprov", "pin-bcpkix", "pin-bcutil", "pin-guava", "pin-jose4j", "pin-jdom2"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
